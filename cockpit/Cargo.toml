[package]
name = "cockpit"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
anyhow = "1"
vt100 = "0.15"
tui-term = "0.2"
libc = "0.2"

[[bin]]
name = "cockpit"
path = "src/main.rs"

[dev-dependencies]
# setsid(2) for the exit-code test: it must measure "no controlling terminal",
# and the only way to guarantee that from inside a test is to detach the child.
libc = "0.2"
